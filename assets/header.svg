<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MDV Cybersecurity Portfolio</title>
  <desc id="desc">Dark technical profile banner for engineering, DFIR and threat research</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="0.55" stop-color="#0a1110"/>
      <stop offset="1" stop-color="#07110d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff88" stop-opacity="1"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#39ff88" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 82H310L338 54H495" fill="none" stroke="#39ff88" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M1200 278H890L862 306H705" fill="none" stroke="#39ff88" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="338" cy="54" r="4" fill="#39ff88" filter="url(#glow)"/>
  <circle cx="862" cy="306" r="4" fill="#39ff88" filter="url(#glow)"/>

  <g transform="translate(82 74)">
    <rect x="0" y="0" width="164" height="164" rx="26" fill="#0c1713" stroke="#39ff88" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M28 119V43h19l35 46 35-46h19v76h-20V74L83 117h-3L48 74v45z" fill="#e7fff0"/>
    <path d="M137 31h15v15h-15zM137 118h15v15h-15zM18 31h15v15H18zM18 118h15v15H18z" fill="#39ff88" opacity="0.9"/>
  </g>

  <g transform="translate(292 92)">
    <text x="0" y="48" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#39ff88">MICHEL-DV</text>
    <text x="0" y="108" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1" fill="#f2fff6">CYBERSECURITY PORTFOLIO</text>
    <rect x="0" y="132" width="720" height="2" fill="url(#line)"/>
    <text x="0" y="174" font-family="Consolas, Menlo, monospace" font-size="19" fill="#b8c9bf">Windows Internals  •  Detection Engineering  •  Malware Analysis</text>
    <text x="0" y="205" font-family="Consolas, Menlo, monospace" font-size="19" fill="#b8c9bf">Network Security  •  DFIR  •  Threat Research  •  Security Tooling</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#39ff88" opacity="0.62">
    <text x="82" y="314">[ BUILD ]  observe → analyze → detect → explain</text>
    <text x="936" y="314">STATUS // ACTIVE</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#39ff88" stroke-opacity="0.18" stroke-width="2"/>
</svg>