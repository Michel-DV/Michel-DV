<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MDV Security Portfolio Map</title>
  <desc id="desc">Map of flagship projects grouped by security domain</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0c1411"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg)" stroke="#39ff88" stroke-opacity="0.15"/>

  <text x="60" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#f0fff4">PORTFOLIO MAP</text>
  <text x="60" y="92" font-family="Consolas, Menlo, monospace" font-size="15" fill="#91a79a">Flagship projects by security domain</text>

  <g stroke="#39ff88" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M600 154V210"/>
    <path d="M600 210H220V250"/>
    <path d="M600 210H600V250"/>
    <path d="M600 210H980V250"/>
  </g>

  <g transform="translate(438 116)">
