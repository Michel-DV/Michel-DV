    <text x="24" y="102" font-family="Consolas, monospace" font-size="13" fill="#9eb3a6">PE + process triage • C11 • WinAPI</text>
    <text x="24" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0fff4">Win-TraceGuard</text>
