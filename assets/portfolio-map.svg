    <text x="24" y="102" font-family="Consolas, monospace" font-size="13" fill="#9eb3a6">IoT discovery • exposure triage • Python</text>
    <text x="24" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0fff4">Go-Fast-Scanner</text>
